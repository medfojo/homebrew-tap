name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
      arm64_sha:
        description: "SHA256 of tagboard-tui-darwin-arm64"
        required: true
        type: string
      amd64_sha:
        description: "SHA256 of tagboard-tui-darwin-amd64"
        required: true
        type: string

jobs:
  update-formula:
    name: Patch formula and push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          VERSION: ${{ inputs.version }}
          ARM64_SHA: ${{ inputs.arm64_sha }}
          AMD64_SHA: ${{ inputs.amd64_sha }}
        run: bash .github/scripts/update-formula.sh

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tagboard-tui.rb
          git commit -m "chore: bump tagboard-tui to ${{ inputs.version }}"
          git push
